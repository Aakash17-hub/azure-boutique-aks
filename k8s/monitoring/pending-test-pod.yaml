# Deliberately unschedulable pod (asks for 4 vCPU on a 2-vCPU node).
# Used to test the boutique-pod-pending alert; delete it afterwards:
#   kubectl -n boutique delete pod pending-test
apiVersion: v1
kind: Pod
metadata:
  name: pending-test
  namespace: boutique
spec:
  containers:
  - name: test
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests: {cpu: "4"}
