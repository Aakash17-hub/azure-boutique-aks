# Key Vault secret mounted into a pod with AKS Workload Identity.
# Apply with the identity's client ID and the tenant ID filled in:
#   export CLIENT_ID=$(az identity show -g rg-boutique -n id-boutique-kv --query clientId -o tsv)
#   export TENANT_ID=$(az account show --query tenantId -o tsv)
#   envsubst < k8s/keyvault/kv-demo.yaml | kubectl apply -f -
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kv-reader
  namespace: boutique
  annotations:
    azure.workload.identity/client-id: "${CLIENT_ID}"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: kv-boutique
  namespace: boutique
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${CLIENT_ID}"
    keyvaultName: kv-boutique-aakash
    tenantId: "${TENANT_ID}"
    objects: |
      array:
        - |
          objectName: demo-api-key
          objectType: secret
---
apiVersion: v1
kind: Pod
metadata:
  name: kv-test
  namespace: boutique
  labels:
    azure.workload.identity/use: "true"
spec:
  serviceAccountName: kv-reader
  containers:
  - name: test
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 50m, memory: 32Mi}
    volumeMounts:
    - name: secrets
      mountPath: /mnt/secrets
      readOnly: true
  volumes:
  - name: secrets
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: kv-boutique
